<!doctype html>
<title>Sign in</title>
{% if throttled %}
<p>Too many attempts. Please try again in a few minutes.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Sign in</button>
</form>
<p><a href="{% url 'identity:password-reset' %}">Forgot your password?</a></p>
