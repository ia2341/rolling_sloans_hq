<!doctype html>
<title>Request a password reset</title>
{% if sent %}
<p>If that address is on the list, we've sent a link to reset your password.</p>
{% elif throttled %}
<p>Too many requests. Please try again in a few minutes.</p>
{% else %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Send reset link</button>
</form>
{% endif %}
