name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rolling_sloans
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d rolling_sloans"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env: &production_like_env
      DJANGO_SECRET_KEY: test-secret-key-not-used-anywhere-real
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: example.com
      DATABASE_URL: postgres://user:password@dbhost:5432/rolling_sloans?sslmode=require
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
      AWS_STORAGE_BUCKET_NAME: test-bucket
      AWS_S3_ENDPOINT_URL: https://test.r2.cloudflarestorage.com
      RESEND_API_KEY: test-resend-key
      CLUB_EMAIL_FROM: test@example.com
      SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/rolling_sloans?sslmode=disable
        run: python manage.py test --parallel

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  build:
    name: Build
    runs-on: ubuntu-latest
    env: *production_like_env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Build
        run: python manage.py check --deploy
      - name: Collect static files
        run: python manage.py collectstatic --no-input

  no-secrets-committed:
    name: No committed secrets or real member data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for likely secrets / env files
        run: |
          set -e
          # Guard against the privacy-by-design constraint: no .env files, private keys,
          # or common credential file patterns should ever be committed.
          if git ls-files | grep -vE '(^|/)\.env\.example$' | grep -E '(^|/)\.env($|\.[^.]+$)|\.pem$|\.key$|id_rsa|id_ed25519' ; then
            echo "Found a file that looks like a secret or credential. Remove it and use environment variables / a secrets manager instead."
            exit 1
          fi
          echo "No obvious committed secrets found."
