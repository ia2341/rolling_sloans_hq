name: Weekly database backup

on:
  schedule:
    - cron: "0 6 * * 0" # 06:00 UTC every Sunday
  workflow_dispatch: {}

jobs:
  backup:
    name: Dump Neon Postgres to R2
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client and awscli
        run: sudo apt-get update && sudo apt-get install -y postgresql-client awscli

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --format=custom --file="backup-$(date +%F).dump"

      - name: Upload dump to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp backup-*.dump "s3://${R2_BUCKET}/db-backups/" --endpoint-url "$R2_ENDPOINT_URL"
