name: Weekly database backup

on:
  schedule:
    - cron: "0 6 * * 0" # 06:00 UTC every Sunday
  workflow_dispatch: {}

permissions: {}

jobs:
  backup:
    name: Dump Neon Postgres to R2
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client and awscli
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg awscli
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          BACKUP_FILE="backup-$(date -u +%F)-${GITHUB_RUN_ID}.dump"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          pg_dump "$DATABASE_URL" --format=custom --file="$BACKUP_FILE"

      - name: Upload dump to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "$BACKUP_FILE" "s3://${R2_BUCKET}/db-backups/${BACKUP_FILE}" --endpoint-url "$R2_ENDPOINT_URL"
