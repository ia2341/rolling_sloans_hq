<div class="skip-date-row" data-form-prefix="{{ form.prefix }}">
  <span class="skip-date-delete-checkbox-wrapper" style="display:none">{{ form.DELETE }}</span>
  <label for="{{ form.start_date.id_for_label }}">Date (or range start)</label>
  {{ form.start_date }}
  {{ form.start_date.errors }}
  <label for="{{ form.end_date.id_for_label }}">Range end (optional)</label>
  {{ form.end_date }}
  {{ form.end_date.errors }}
  <button type="button" class="skip-date-remove" @click="removeSkipDateRow($event)">Remove</button>
</div>
