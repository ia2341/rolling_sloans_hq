<!doctype html>
<!--
  PROTOTYPE — throwaway. Ticket #303 on map #302.
  Question: what is the global shell (nav, phone included), where does admin work live,
  and what does the Overview look like in whichever shell wins?

  Three variants, switchable via #<variant>/<page> and the bottom bar:
    A  Edit in place   — member pages flip into edit mode; /manage/ shrinks to two doors
    B  Admin section   — /manage/* absorbs the editors; member pages read-only for everyone
    C  Mode switch     — one set of pages, a global Member/Admin mode arms every editor at once

  Greybox: structure only. No colour, type or theme decisions are being proposed here.
  All data synthesized — no real member data (CONTRIBUTING.md).
-->
<title>Shell Greybox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---- tokens: cool-biased greys, blueprint register ---- */
  :root {
    --paper:      #eef0f4;
    --surface:    #ffffff;
    --surface-2:  #f4f6f9;
    --box:        #e3e7ee;
    --line:       #c6ccd8;
    --line-soft:  #dde2ea;
    --ink:        #171a21;
    --ink-2:      #4d5566;
    --ink-3:      #79808f;
    --chrome:     #1d2430;
    --chrome-ink: #e9ecf2;
    --mark:       #2f4fd0;   /* prototype chrome only, never inside a frame */
    --draft:      #8a5a10;   /* the draft-semester state the shell must carry */
    --draft-bg:   #f6ecd8;
    --radius:     6px;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #14171d;
      --surface:    #1c2029;
      --surface-2:  #232833;
      --box:        #2b313d;
      --line:       #414958;
      --line-soft:  #333a47;
      --ink:        #e7eaf0;
      --ink-2:      #a8b0bf;
      --ink-3:      #7d8593;
      --chrome:     #0d1015;
      --chrome-ink: #e9ecf2;
      --mark:       #7f95ee;
      --draft:      #e0b566;
      --draft-bg:   #33291339;
    }
  }
  :root[data-theme="dark"] {
    --paper:      #14171d;
    --surface:    #1c2029;
    --surface-2:  #232833;
    --box:        #2b313d;
    --line:       #414958;
    --line-soft:  #333a47;
    --ink:        #e7eaf0;
    --ink-2:      #a8b0bf;
    --ink-3:      #7d8593;
    --chrome:     #0d1015;
    --chrome-ink: #e9ecf2;
    --mark:       #7f95ee;
    --draft:      #e0b566;
    --draft-bg:   #33291339;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
    padding: 18px 18px 108px;
  }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---- prototype chrome (outside the frame) ---- */
  .chrome-head {
    max-width: 1180px; margin: 0 auto 14px; display: flex; flex-wrap: wrap;
    align-items: baseline; gap: 10px 16px;
  }
  .chrome-head h1 { font-size: 15px; letter-spacing: -0.01em; }
  .chrome-head .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-3);
    border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px;
  }
  .chrome-head p { margin: 0; color: var(--ink-2); font-size: 12.5px; max-width: 62ch; }

  .stage { max-width: 1180px; margin: 0 auto; }

  /* the device frame */
  .frame {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column;
    margin: 0 auto;
  }
  .frame.desktop { width: 100%; min-height: 660px; }
  .frame.phone {
    width: 390px; height: 780px; border-radius: 26px; border-width: 8px;
    border-color: var(--chrome); box-shadow: 0 10px 34px rgb(0 0 0 / 0.18);
  }
  .frame-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

  /* the tradeoff note, deliberately outside the frame */
  .verdict {
    max-width: 1180px; margin: 16px auto 0; border: 1px solid var(--line-soft);
    border-radius: var(--radius); background: var(--surface); padding: 14px 16px;
  }
  .verdict h2 { font-size: 12px; font-family: var(--mono); letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .verdict ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .verdict li { color: var(--ink-2); font-size: 13px; }
  .verdict li b { color: var(--ink); font-weight: 600; }

  /* ---- greybox primitives (inside the frame) ---- */
  .gb-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .bar { height: 8px; border-radius: 2px; background: var(--box); display: block; }
  .prose { display: grid; gap: 6px; }
  .btn {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: var(--radius); padding: 6px 11px; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .field {
    border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
    padding: 4px 7px; font-size: 13px; min-height: 28px; display: flex; align-items: center;
    color: var(--ink-2);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
    background: var(--surface-2); border-radius: 99px; padding: 2px 9px; font-size: 12px;
  }
  .chip.empty { border-style: dashed; color: var(--ink-3); }
  .chip.backup { border-style: dotted; }
  .muted { color: var(--ink-3); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .card {
    border: 1px solid var(--line-soft); border-radius: var(--radius);
    background: var(--surface); padding: 12px 14px;
  }
  .stack { display: grid; gap: 12px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .scroll-x { overflow-x: auto; }

  table.gb { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.gb th, table.gb td {
    border-bottom: 1px solid var(--line-soft); padding: 7px 10px; text-align: left;
    vertical-align: middle;
  }
  table.gb th { font-weight: 600; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
  table.gb td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* page body */
  .page { padding: 16px; display: grid; gap: 16px; }
  .frame.desktop .page { padding: 22px 28px; max-width: 1000px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .page-head h1 { font-size: 20px; letter-spacing: -0.015em; }
  .frame.phone .page-head h1 { font-size: 17px; }
  .page-head .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .section-head { font-size: 13px; color: var(--ink-2); font-weight: 600; }

  /* ---- shared shell chrome (inside the frame) ---- */
  .topbar {
    display: flex; align-items: center; gap: 18px; padding: 0 20px; height: 52px;
    border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0;
  }
  .brand { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; }
  .topnav { display: flex; gap: 2px; flex: 1; }
  .topnav a {
    text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 5px;
    font-size: 13px; white-space: nowrap;
  }
  .topnav a[aria-current] { color: var(--ink); background: var(--surface-2); font-weight: 600; }
  .topbar .right { display: flex; align-items: center; gap: 8px; }

  .phonebar {
    display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 50px;
    border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0;
  }
  .phonebar .title { font-weight: 600; font-size: 15px; flex: 1; }

  .tabbar {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    border-top: 1px solid var(--line); background: var(--surface); flex-shrink: 0;
    padding-bottom: 6px;
  }
  .tabbar a {
    text-decoration: none; color: var(--ink-3); display: grid; justify-items: center;
    gap: 3px; padding: 7px 2px 3px; font-size: 10.5px;
  }
  .tabbar a[aria-current] { color: var(--ink); font-weight: 600; }
  .tabbar .glyph {
    width: 20px; height: 20px; border: 1.5px solid currentColor; border-radius: 5px;
  }

  /* the draft-semester strip the shell must always have a home for */
  .draft-strip {
    background: var(--draft-bg); color: var(--draft); border-bottom: 1px solid var(--line);
    padding: 7px 16px; font-size: 12.5px; display: flex; align-items: center;
    gap: 10px; flex-shrink: 0;
  }
  .draft-strip b { font-weight: 600; }
  .draft-strip .btn { border-color: currentColor; color: inherit; background: transparent; }

  /* edit-mode toolbar (variant A) */
  .edit-toolbar {
    background: var(--ink); color: var(--surface); padding: 8px 16px;
    display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-size: 13px;
  }
  .edit-toolbar .grow { flex: 1; font-weight: 600; }
  .edit-toolbar .btn { background: transparent; border-color: rgb(255 255 255 / 0.35); color: inherit; }
  .edit-toolbar .btn.primary { background: var(--surface); color: var(--ink); border-color: var(--surface); }

  /* admin section (variant B) */
  .adminshell { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 232px; flex-shrink: 0; border-right: 1px solid var(--line);
    background: var(--surface-2); padding: 14px 0; overflow-y: auto;
  }
  .sidebar .group { padding: 10px 16px 4px; }
  .sidebar .group .gb-label { display: block; }
  .sidebar a {
    display: block; text-decoration: none; color: var(--ink-2); padding: 6px 16px; font-size: 13px;
  }
  .sidebar a[aria-current] {
    color: var(--ink); font-weight: 600; background: var(--surface);
    box-shadow: inset 2px 0 0 var(--ink);
  }
  .sidebar .semester-pick { padding: 0 16px 10px; display: grid; gap: 6px; }
  .adminbar {
    display: flex; align-items: center; gap: 10px; padding: 0 20px; height: 48px;
    border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0;
  }
  .adminbar .title { font-weight: 600; flex: 1; }
  .admin-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; color: var(--ink-2);
  }
  .drawer-backdrop {
    position: absolute; inset: 0; background: rgb(0 0 0 / 0.35); display: flex;
  }
  .drawer {
    width: 252px; background: var(--surface); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 12px 0;
  }
  .framewrap { position: relative; display: flex; flex-direction: column; flex: 1; min-height: 0; }

  /* mode switch (variant C) */
  .modeswitch {
    display: inline-flex; border: 1px solid var(--line); border-radius: 99px;
    overflow: hidden; background: var(--surface-2);
  }
  .modeswitch button {
    border: 0; background: transparent; padding: 4px 12px; font-size: 12.5px;
    cursor: pointer; color: var(--ink-3);
  }
  .modeswitch button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
  .mode-context {
    display: flex; align-items: center; gap: 8px; padding: 6px 16px; font-size: 12.5px;
    border-bottom: 1px solid var(--line); background: var(--surface-2); flex-shrink: 0;
  }
  .mode-context.draft { background: var(--draft-bg); color: var(--draft); }
  .mode-context .grow { flex: 1; }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 14px 16px 20px;
    box-shadow: 0 -8px 24px rgb(0 0 0 / 0.16);
  }
  .sheet a { display: block; text-decoration: none; padding: 9px 4px; border-bottom: 1px solid var(--line-soft); }

  /* overview song-progress treatments */
  .prog { display: flex; align-items: center; gap: 8px; }
  .prog .track { flex: 1; height: 5px; background: var(--box); border-radius: 99px; min-width: 60px; }
  .prog .fill { height: 100%; background: var(--ink-2); border-radius: 99px; }
  .songcards { display: grid; gap: 8px; }
  .songcards .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
  .songlist { display: grid; }
  .songlist .item {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line-soft);
  }
  .songlist .item .sub { grid-column: 1 / -1; }

  /* assignment grid treatments */
  .matrix th:first-child, .matrix td:first-child {
    position: sticky; left: 0; background: var(--surface); z-index: 1;
  }
  .accordion .acc-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-weight: 600; font-size: 13px;
  }

  /* ---- bottom switcher (prototype chrome) ---- */
  .switcher {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: var(--chrome); color: var(--chrome-ink); border-radius: 99px;
    padding: 7px 9px; box-shadow: 0 6px 26px rgb(0 0 0 / 0.3); max-width: calc(100vw - 24px);
  }
  .switcher button, .switcher select {
    font: inherit; font-size: 12.5px; border: 1px solid rgb(255 255 255 / 0.22);
    background: rgb(255 255 255 / 0.06); color: inherit; border-radius: 99px;
    padding: 4px 11px; cursor: pointer;
  }
  .switcher select { padding: 4px 8px; }
  .switcher .vname {
    font-family: var(--mono); font-size: 12px; padding: 0 6px; min-width: 168px;
    text-align: center; letter-spacing: -0.01em;
  }
  .switcher .seg { display: inline-flex; border-radius: 99px; overflow: hidden;
    border: 1px solid rgb(255 255 255 / 0.22); }
  .switcher .seg button { border: 0; border-radius: 0; }
  .switcher .seg button[aria-pressed="true"] { background: var(--mark); color: #fff; font-weight: 600; }
  .switcher .divider { width: 1px; height: 20px; background: rgb(255 255 255 / 0.2); }

  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="chrome-head">
  <h1>Rolling Sloans — shell greybox</h1>
  <span class="tag">Prototype · #303</span>
  <p>Three structurally different answers to “where does admin work live”, each carrying the nav
  model and Overview layout that follow from it. Structure only — no colour, type or theme is being
  proposed. All names, songs and dates are synthesized.</p>
</div>

<div class="stage" id="stage"></div>
<div class="verdict" id="verdict"></div>

<div class="switcher" role="group" aria-label="Prototype controls">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="vname" id="vname"></span>
  <button id="next" aria-label="Next variant">→</button>
  <span class="divider"></span>
  <span class="seg" id="viewportseg">
    <button data-vp="desktop">Desktop</button>
    <button data-vp="phone">Phone</button>
  </span>
  <span class="seg" id="roleseg">
    <button data-role="member">Member</button>
    <button data-role="admin">Admin</button>
  </span>
  <span class="divider"></span>
  <select id="pagesel" aria-label="Page"></select>
</div>

<script>
/* ============================================================
   Synthesized data — nothing here corresponds to a real person.
   ============================================================ */
const SEMESTERS = [
  { name: 'Fall 2026', status: 'Live' },
  { name: 'Spring 2027', status: 'Draft' },
];

const SONGS = [
  { pos: 1, title: 'Paper Lanterns',      len: '3:42', done: 5, total: 5, mine: true  },
  { pos: 2, title: 'Riverbend',           len: '4:15', done: 3, total: 6, mine: true  },
  { pos: 3, title: 'Static Bloom',        len: '2:58', done: 6, total: 6, mine: false },
  { pos: 4, title: 'Two Weeks in June',   len: '5:07', done: 0, total: 5, mine: false },
  { pos: 5, title: 'Marigold',            len: '3:20', done: 4, total: 5, mine: true  },
  { pos: 6, title: 'Cold Open',           len: '3:55', done: 2, total: 6, mine: false },
  { pos: 7, title: 'The Long Way Down',   len: '6:12', done: 5, total: 5, mine: true  },
  { pos: 8, title: 'Ninety-Nine Summers', len: '4:01', done: 1, total: 6, mine: false },
];

const ROLES = ['Lead Vocals', 'Guitar', 'Bass', 'Drums', 'Keys'];
const PEOPLE = [
  { name: 'Avery Cho',      roles: 'Lead Vocals, Keys' },
  { name: 'Dani Okafor',    roles: 'Drums' },
  { name: 'Priya Raman',    roles: 'Bass, Backing Vocals' },
  { name: 'Marcus Vale',    roles: 'Guitar' },
  { name: 'Nina Restrepo',  roles: 'Keys, Backing Vocals' },
  { name: 'Theo Lindqvist', roles: 'Guitar, Bass' },
  { name: 'Sam Aterlay',    roles: 'Lead Vocals' },
];

/* Song × Role assignment cells. '' = unfilled, '~' prefix = backup, '!' = role mismatch (ADR 0002) */
const GRID = {
  'Paper Lanterns':    ['Avery Cho', 'Marcus Vale', 'Priya Raman', 'Dani Okafor', 'Nina Restrepo'],
  'Riverbend':         ['Sam Aterlay', 'Theo Lindqvist', '', 'Dani Okafor', ''],
  'Static Bloom':      ['Avery Cho', 'Marcus Vale', 'Theo Lindqvist', 'Dani Okafor', 'Nina Restrepo'],
  'Two Weeks in June': ['', '', '', '', ''],
  'Marigold':          ['Sam Aterlay', 'Marcus Vale', 'Priya Raman', '~Dani Okafor', '!Avery Cho'],
};

const REHEARSALS = [
  { date: 'Tue 15 Sep', time: '19:00–21:00', mine: '19:00–20:10', label: '' },
  { date: 'Thu 17 Sep', time: '19:00–21:00', mine: null,          label: '' },
  { date: 'Tue 22 Sep', time: '19:00–21:00', mine: '19:40–21:00', label: '' },
  { date: 'Sat 26 Sep', time: '14:00–18:00', mine: '14:00–18:00', label: 'Dress rehearsal' },
];

/* ============================================================
   Variants
   ============================================================ */
const VARIANTS = {
  a: {
    key: 'a', name: 'Edit in place',
    blurb: 'Member pages flip into edit mode. /manage/ shrinks to two doors on the Overview.',
    verdict: [
      ['Nav stays five tabs', 'no admin destination competes for tab-bar space — the bar works unchanged on a phone.'],
      ['Editing is where the thing is', 'you edit the setlist on the page that shows the setlist; nothing is duplicated.'],
      ['The cost: admin destinations are homeless', 'Conflicts and Semesters have no nav entry, so they live in an Overview panel an admin has to go back to Home to reach.'],
      ['The cost: every page carries a mode', 'each surface needs its own edit route, toolbar and preview — 36 gated views stay spread across the app, which is today’s problem unresolved.'],
      ['Banner home', 'a strip under the nav, on every page. Survives unchanged from the context processor (#169).'],
    ],
  },
  b: {
    key: 'b', name: 'Admin section',
    blurb: '/manage/* absorbs the editors and grows its own nav. Member pages read-only for everyone.',
    verdict: [
      ['One place that is “the admin app”', 'all 36 gated views sit behind one door with a sidebar that lists them — the thing today’s split lacks.'],
      ['Member pages get simpler', 'no modes, no toolbars, no admin branches in member templates.'],
      ['The cost: ADR 0009 forces a shadow schedule', 'assignment editing is only computable inside a Rehearsal, so /manage/ needs its own rehearsal picker and grid — a second copy of the page members already read.'],
      ['The cost: context switching', 'fixing one wrong assignment means leaving the member view, finding the rehearsal again, editing, and coming back.'],
      ['Banner home', 'the member app keeps the strip; inside the admin app the sidebar’s semester picker <em>is</em> the banner, so the strip would be redundant there — the context processor needs an opinion about that.'],
    ],
  },
  c: {
    key: 'c', name: 'Mode switch',
    blurb: 'One set of pages. A global Member/Admin switch arms every editor at once and reveals admin-only tabs.',
    verdict: [
      ['No second copy of anything', 'one Schedule page, one Setlist page; admin mode makes the fields on them editable in place.'],
      ['Admin destinations get nav entries', 'Conflicts and Semesters appear as real tabs, but only in admin mode — on a phone they land behind “More”.'],
      ['Banner and switcher become one control', 'the mode bar states which semester you are editing, so the draft warning and the semester picker stop being two separate things.'],
      ['The cost: mode is global, hidden state', 'a deep link has to encode it, and “why can’t I edit this” becomes a real support question.'],
      ['The cost: read and write share a template', 'every surface renders both states, so the member view is only ever one bug away from showing an editor.'],
    ],
  },
};
const ORDER = ['a', 'b', 'c'];

const PAGES = [
  ['overview',  'Overview'],
  ['schedule',  'Schedule — rehearsal'],
  ['songs',     'Songs / setlist'],
  ['members',   'Band members'],
  ['profile',   'Profile'],
  ['conflicts', 'Conflicts (admin)'],
  ['semesters', 'Semesters (admin)'],
];

/* ============================================================
   State + routing
   ============================================================ */
const state = { variant: 'a', page: 'overview', viewport: 'desktop', role: 'admin',
                editing: false, drawer: false, sheet: false };

function readHash() {
  const m = (location.hash || '').replace(/^#\/?/, '').split('/');
  if (ORDER.includes(m[0])) state.variant = m[0];
  if (PAGES.some(p => p[0] === m[1])) state.page = m[1];
}
function writeHash() { location.hash = `#${state.variant}/${state.page}`; }
function go(page) { state.page = page; state.editing = false; state.drawer = false; state.sheet = false; writeHash(); render(); }
function setVariant(v) { state.variant = v; state.editing = false; state.drawer = false; state.sheet = false; writeHash(); render(); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isPhone = () => state.viewport === 'phone';
const isAdmin = () => state.role === 'admin';
const pageTitle = () => (PAGES.find(p => p[0] === state.page) || [, 'Overview'])[1].replace(/ —.*| \(admin\)/, '');
const bars = n => `<span class="prose">${'<span class="bar"></span>'.repeat(n)}</span>`;

/* Admin pages are unreachable as a member — fall back so the frame is never blank. */
function effectivePage() {
  if (!isAdmin() && (state.page === 'conflicts' || state.page === 'semesters')) return 'overview';
  return state.page;
}

/* ============================================================
   Page bodies — shared across variants; the shell differs, and
   each variant answers the phone-table question its own way.
   ============================================================ */

/* --- Overview --------------------------------------------- */
function overviewPage(v) {
  const next = REHEARSALS[0];
  const editable = v === 'c' && isAdmin();

  const nextCard = `
    <div class="card stack" style="gap:8px">
      <span class="gb-label">Next rehearsal</span>
      <div class="row-between">
        <div>
          <div style="font-size:16px;font-weight:600">${next.date} · ${next.time}</div>
          <div class="muted" style="font-size:12.5px">Arrive around 19:00, free to leave around 20:10</div>
        </div>
        <a class="btn sm" href="#${v}/schedule" onclick="go('schedule');return false">Open</a>
      </div>
      <div class="prog"><span class="gb-label">Your slots</span>
        <span class="track"><span class="fill" style="width:58%"></span></span>
        <span class="mono muted" style="font-size:11.5px">3 of 5 songs</span></div>
    </div>`;

  const upcoming = `
    <div class="stack" style="gap:8px">
      <div class="row-between"><h2 class="section-head">Upcoming rehearsals</h2>
        <a class="btn sm ghost" href="#${v}/schedule" onclick="go('schedule');return false">All →</a></div>
      <div class="songlist">
        ${REHEARSALS.map(r => `
          <div class="item">
            <div><b style="font-weight:600">${r.date}</b> <span class="mono muted">${r.time}</span>
              ${r.label ? `<span class="chip" style="margin-left:6px">${r.label}</span>` : ''}</div>
            <div class="mono" style="font-size:12px;${r.mine ? '' : 'color:var(--ink-3)'}">
              ${r.mine ? r.mine : 'not needed'}</div>
          </div>`).join('')}
      </div>
    </div>`;

  /* Each variant answers "the Overview table has no phone layout" differently. */
  let progress;
  if (v === 'a') {
    /* A — the repo's existing .rs-stack-table card pattern, one card per song. */
    progress = isPhone() ? `
      <div class="songcards">
        ${SONGS.map(s => `
          <div class="card" style="padding:10px 12px">
            <div class="row-between"><b style="font-weight:600">${s.title}</b>
              <span class="mono muted" style="font-size:12px">#${s.pos}</span></div>
            <div class="kv"><span class="muted">Cast</span><span class="mono">${s.done} of ${s.total}</span></div>
            <div class="prog" style="margin-top:6px"><span class="track">
              <span class="fill" style="width:${(s.done / s.total) * 100}%"></span></span></div>
          </div>`).join('')}
      </div>` : progressTable();
  } else if (v === 'b') {
    /* B — a two-line list row that needs no phone/desktop fork at all. */
    progress = `<div class="songlist">
      ${SONGS.map(s => `
        <div class="item">
          <div><b style="font-weight:600">${s.title}</b></div>
          <div class="mono" style="font-size:12px">${s.done}/${s.total}</div>
          <div class="sub prog"><span class="mono muted" style="font-size:11px;min-width:22px">#${s.pos}</span>
            <span class="track"><span class="fill" style="width:${(s.done / s.total) * 100}%"></span></span></div>
        </div>`).join('')}
    </div>`;
  } else {
    /* C — regrouped by casting state: the hierarchy an admin actually scans for. */
    const groups = [
      ['Needs casting', SONGS.filter(s => s.done === 0)],
      ['Partly cast',   SONGS.filter(s => s.done > 0 && s.done < s.total)],
      ['Fully cast',    SONGS.filter(s => s.done === s.total)],
    ];
    progress = `<div class="stack" style="gap:14px">
      ${groups.map(([label, list]) => `
        <div>
          <div class="row-between" style="margin-bottom:4px">
            <span class="gb-label">${label}</span><span class="mono muted" style="font-size:11px">${list.length}</span>
          </div>
          <div class="songlist">
            ${list.map(s => `<div class="item">
              <div><b style="font-weight:600">${s.title}</b>
                <span class="mono muted" style="font-size:11.5px">· #${s.pos}</span></div>
              <div class="mono" style="font-size:12px">${s.done}/${s.total}</div>
            </div>`).join('') || '<div class="item"><span class="muted">None</span></div>'}
          </div>
        </div>`).join('')}
    </div>`;
  }

  /* Variant A alone has to park the admin doors on this page. */
  const adminPanel = (v === 'a' && isAdmin()) ? `
    <div class="card stack" style="gap:10px;border-style:dashed">
      <div class="row-between"><span class="gb-label">Admin</span>
        <span class="mono muted" style="font-size:11px">only entry point</span></div>
      <div class="row-between" style="flex-wrap:wrap;gap:8px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span class="muted" style="font-size:12.5px">Viewing</span>
          <span class="field" style="min-width:150px">Fall 2026 — Live ▾</span>
          <button class="btn sm">Switch</button>
        </div>
        <div style="display:flex;gap:6px"><button class="btn sm">Publish</button>
          <button class="btn sm primary">Create semester</button></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn sm" href="#a/conflicts" onclick="go('conflicts');return false">Conflicts <b>3</b></a>
        <a class="btn sm" href="#a/semesters" onclick="go('semesters');return false">Semesters</a>
        <a class="btn sm" href="#a/members" onclick="go('members');return false">People</a>
      </div>
    </div>` : '';

  return `
    ${pageHead(v, 'Overview', v === 'a' && isAdmin() ? [] : null)}
    ${adminPanel}
    ${nextCard}
    ${upcoming}
    <div class="stack" style="gap:8px">
      <div class="row-between">
        <h2 class="section-head">Song progress</h2>
        <div style="display:flex;gap:6px;align-items:center">
          ${editable ? '<span class="chip">editable</span>' : ''}
          <button class="btn sm">My songs only</button>
        </div>
      </div>
      ${progress}
    </div>`;
}

function progressTable() {
  return `<div class="scroll-x"><table class="gb">
    <thead><tr><th>Song</th><th>Position</th><th>Length</th><th>Cast</th></tr></thead>
    <tbody>${SONGS.map(s => `<tr>
      <td>${s.title}</td><td class="num">${s.pos}</td><td class="num">${s.len}</td>
      <td><span class="prog"><span class="track" style="max-width:90px">
        <span class="fill" style="width:${(s.done / s.total) * 100}%"></span></span>
        <span class="mono" style="font-size:12px">${s.done}/${s.total}</span></span></td>
    </tr>`).join('')}</tbody></table></div>`;
}

/* --- Schedule (the densest surface; the real stress test) --- */
function schedulePage(v) {
  const armed = (v === 'a' && state.editing) || (v === 'c' && isAdmin()) || (v === 'b' && false);
  const r = REHEARSALS[0];

  const head = pageHead(v, `${r.date}`,
    (v === 'a' && isAdmin()) ? [{ label: state.editing ? 'Done' : 'Edit assignments', act: 'toggleEdit' }] : null,
    `${r.time} · Rehearsal 1 of 12`);

  const mine = `
    <div class="card stack" style="gap:8px">
      <span class="gb-label">You at this rehearsal</span>
      <div style="font-size:15px">Arrive around <b class="mono">19:00</b>, free to leave around <b class="mono">20:10</b></div>
      <div class="muted" style="font-size:12.5px">Break: 19:25–19:40</div>
      <div class="row-between" style="border-top:1px solid var(--line-soft);padding-top:8px">
        <div><span class="gb-label">Your availability</span>
          <div style="font-size:13px">Available all evening</div></div>
        <button class="btn sm">Declare a conflict</button>
      </div>
    </div>`;

  /* Running order — the same in every variant; only who can drag it differs. */
  const order = `
    <div class="stack" style="gap:8px">
      <div class="row-between"><h2 class="section-head">Running order</h2>
        ${armed ? '<div style="display:flex;gap:6px"><button class="btn sm">Deal</button><button class="btn sm">Shuffle</button></div>' : ''}</div>
      <div class="songlist">
        ${Object.keys(GRID).map((t, i) => `
          <div class="item">
            <div style="display:flex;gap:8px;align-items:center">
              ${armed ? '<span class="mono muted" style="cursor:grab">⠿</span>' : ''}
              <b style="font-weight:600">${t}</b>
              ${i === 4 ? '<span class="chip">pinned · recording</span>' : ''}
            </div>
            <div class="mono muted" style="font-size:12px">${19 + Math.floor(i * 24 / 60)}:${String((i * 24) % 60).padStart(2, '0')}</div>
          </div>`).join('')}
      </div>
    </div>`;

  /* The Song × Role matrix — each variant takes a different line on phone. */
  let grid;
  const cell = val => {
    if (!val) return armed ? '<span class="chip empty">+ assign</span>' : '<span class="muted">—</span>';
    if (val[0] === '~') return `<span class="chip backup">${val.slice(1)} <span class="muted">bk</span></span>`;
    if (val[0] === '!') return `<span class="chip">${val.slice(1)} <span class="muted">⚠</span></span>`;
    return `<span class="chip">${val}</span>`;
  };

  if (!isPhone()) {
    grid = `<div class="scroll-x"><table class="gb matrix">
      <thead><tr><th>Song</th>${ROLES.map(x => `<th>${x}</th>`).join('')}</tr></thead>
      <tbody>${Object.entries(GRID).map(([song, cells]) => `<tr>
        <td><b style="font-weight:600">${song}</b></td>
        ${cells.map(c => `<td>${cell(c)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  } else if (v === 'a') {
    /* A — keep the matrix, scroll it sideways with the song column frozen. */
    grid = `<div class="scroll-x"><table class="gb matrix" style="min-width:640px">
      <thead><tr><th>Song</th>${ROLES.map(x => `<th>${x}</th>`).join('')}</tr></thead>
      <tbody>${Object.entries(GRID).map(([song, cells]) => `<tr>
        <td><b style="font-weight:600">${song}</b></td>
        ${cells.map(c => `<td>${cell(c)}</td>`).join('')}</tr>`).join('')}
      </tbody></table>
      <div class="gb-label" style="margin-top:6px">↔ scrolls · song column frozen</div></div>`;
  } else if (v === 'b') {
    /* B — one card per song, roles as rows inside it. */
    grid = `<div class="songcards">
      ${Object.entries(GRID).map(([song, cells]) => `
        <div class="card" style="padding:10px 12px">
          <div class="row-between" style="margin-bottom:6px"><b style="font-weight:600">${song}</b></div>
          ${ROLES.map((role, i) => `<div class="kv" style="padding:3px 0">
            <span class="muted">${role}</span>${cell(cells[i])}</div>`).join('')}
        </div>`).join('')}
    </div>`;
  } else {
    /* C — collapse by role: the axis an admin fills one at a time. */
    grid = `<div class="accordion">
      ${ROLES.map((role, i) => `
        <div>
          <div class="acc-head"><span>${role}</span>
            <span class="mono muted" style="font-size:12px">
              ${Object.values(GRID).filter(c => c[i]).length}/${Object.keys(GRID).length} ${i === 0 ? '▾' : '▸'}</span></div>
          ${i === 0 ? `<div class="songlist" style="padding-left:10px">
            ${Object.entries(GRID).map(([song, cells]) => `<div class="item">
              <div class="muted">${song}</div>${cell(cells[i])}</div>`).join('')}</div>` : ''}
        </div>`).join('')}
    </div>`;
  }

  const gridHead = `
    <div class="row-between">
      <h2 class="section-head">Assignments</h2>
      ${v === 'b' && isAdmin()
        ? '<span class="chip empty">read-only · edit in Admin → Assignments</span>'
        : armed ? '<span class="chip">editing</span>' : ''}
    </div>`;

  return `${head}${mine}${order}<div class="stack" style="gap:8px">${gridHead}${grid}</div>`;
}

/* --- Songs / setlist -------------------------------------- */
function songsPage(v) {
  const armed = (v === 'a' && state.editing) || (v === 'c' && isAdmin());
  const head = pageHead(v, 'Songs',
    (v === 'a' && isAdmin()) ? [{ label: state.editing ? 'Done' : 'Edit setlist', act: 'toggleEdit' }] : null,
    'Fall 2026 · 8 songs · 31:30');

  const rows = SONGS.map(s => isPhone() ? `
    <div class="item">
      <div style="display:flex;gap:8px;align-items:center">
        ${armed ? '<span class="mono muted">⠿</span>' : `<span class="mono muted" style="font-size:12px">${s.pos}</span>`}
        ${armed ? `<span class="field" style="flex:1">${s.title}</span>` : `<b style="font-weight:600">${s.title}</b>`}
      </div>
      <div class="mono" style="font-size:12px">${s.len}</div>
    </div>` : `
    <tr>
      <td class="num">${armed ? '⠿ ' : ''}${s.pos}</td>
      <td>${armed ? `<span class="field">${s.title}</span>` : s.title}</td>
      <td class="num">${armed ? `<span class="field" style="width:70px">${s.len}</span>` : s.len}</td>
      <td class="num">${s.total} roles</td>
      <td>${armed ? '<button class="btn sm">Remove</button>' : `<a href="#${v}/songs">Open</a>`}</td>
    </tr>`).join('');

  const body = isPhone()
    ? `<div class="songlist">${rows}</div>`
    : `<div class="scroll-x"><table class="gb"><thead><tr>
        <th>#</th><th>Song</th><th>Length</th><th>Roles</th><th></th></tr></thead>
       <tbody>${rows}</tbody></table></div>`;

  const addRow = armed ? `
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn sm">+ Add song</button>
      <button class="btn sm">Import from Spotify</button>
    </div>` : '';

  return `${head}${body}${addRow}`;
}

/* --- Band members ----------------------------------------- */
function membersPage(v) {
  const armed = (v === 'a' && state.editing) || (v === 'c' && isAdmin());
  const head = pageHead(v, 'Band members',
    (v === 'a' && isAdmin()) ? [{ label: state.editing ? 'Done' : 'Edit roster', act: 'toggleEdit' }] : null,
    `Fall 2026 · ${PEOPLE.length} members`);

  const body = isPhone() ? `
    <div class="songcards">${PEOPLE.map(p => `
      <div class="card" style="padding:10px 12px">
        <div class="row-between"><b style="font-weight:600">${p.name}</b>
          ${armed ? '<button class="btn sm">Remove</button>' : '<a href="#' + v + '/profile" onclick="go(\'profile\');return false">View</a>'}</div>
        <div class="muted" style="font-size:12.5px">${p.roles}</div>
      </div>`).join('')}</div>` : `
    <div class="scroll-x"><table class="gb"><thead><tr>
      <th>Name</th><th>Roles</th><th>Status</th><th></th></tr></thead>
      <tbody>${PEOPLE.map((p, i) => `<tr>
        <td><b style="font-weight:600">${p.name}</b></td>
        <td>${armed ? `<span class="field">${p.roles} +</span>` : p.roles}</td>
        <td>${i === 5 ? '<span class="chip empty">invited</span>' : '<span class="chip">active</span>'}</td>
        <td>${armed ? '<button class="btn sm">Remove</button>'
          : `<a href="#${v}/profile" onclick="go('profile');return false">View</a>`}</td>
      </tr>`).join('')}</tbody></table></div>`;

  const add = armed ? `<div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn sm">+ Add member</button><button class="btn sm">Import roster</button>
    <button class="btn sm">Send invites</button></div>` : '';

  return `${head}${body}${add}`;
}

/* --- Conflicts (admin only; ADR 0005 — never member-facing) - */

      <span class="gb-label">Admin-only surface</span>

    ${REHEARSALS.slice(0, 3).map((r, i) => `

/* --- Semesters (admin only) -------------------------------- */
function semestersPage(v) {
  return `
    ${pageHead(v, 'Semesters', null, 'Publish, create, delete')}
    <div class="songlist">${SEMESTERS.map(s => `
      <div class="item">
        <div><b style="font-weight:600">${s.name}</b>

const BODIES = { overview: overviewPage, schedule: schedulePage, songs: songsPage,
                 members: membersPage, profile: profilePage, conflicts: conflictsPage,
                 semesters: semestersPage };

/* Page header. `actions` non-null renders variant A's per-page edit affordance. */
function pageHead(v, title, actions, sub) {
  return `<div class="page-head">
    <div><h1>${esc(title)}</h1>
      ${sub ? `<div class="muted" style="font-size:12.5px">${sub}</div>` : ''}</div>
    ${actions && actions.length ? `<div class="actions">${actions.map(a =>
      `<button class="btn ${state.editing ? '' : 'primary'}" onclick="${a.act}()">${a.label}</button>`).join('')}</div>` : ''}
  </div>`;
}

function toggleEdit() { state.editing = !state.editing; render(); }
function toggleDrawer() { state.drawer = !state.drawer; render(); }
function toggleSheet() { state.sheet = !state.sheet; render(); }
function setMode(m) { state.role = m; syncSegs(); render(); }

/* ============================================================
   Shells — one per variant. This is the actual proposal.
   ============================================================ */
const MEMBER_TABS = [
  ['overview', 'Home'], ['schedule', 'Schedule'], ['songs', 'Songs'],
  ['members', 'Band'], ['profile', 'You'],
];

function draftStrip(v, withSwitcher = true) {
  /* Only shown while an admin has a draft selected — the state #169 exists for. */
  if (!isAdmin()) return '';
  return `<div class="draft-strip">
    <b>Viewing Spring 2027</b><span>— not what members see.</span>
    <span style="flex:1"></span>
    ${withSwitcher ? '<button class="btn sm">Back to Fall 2026</button>' : ''}
  </div>`;
}

/* --- Variant A: edit in place ------------------------------ */
function shellA(body) {
  const p = effectivePage();
  if (isPhone()) {
    return `<div class="framewrap">
      <div class="phonebar">
        <span class="title">${esc(pageTitle())}</span>
        ${isAdmin() && ['schedule', 'songs', 'members'].includes(p)
          ? `<button class="btn sm ${state.editing ? '' : 'primary'}" onclick="toggleEdit()">${state.editing ? 'Done' : 'Edit'}</button>` : ''}
      </div>
      ${draftStrip('a')}
      ${state.editing ? editToolbar() : ''}
      <div class="frame-scroll"><div class="page">${body}</div></div>
      ${tabbar(MEMBER_TABS, 'a')}
    </div>`;
  }
  return `<div class="framewrap">
    <div class="topbar">
      <span class="brand">Rolling Sloans</span>
      <nav class="topnav">${MEMBER_TABS.map(([k, l]) =>
        `<a href="#a/${k}" onclick="go('${k}');return false" ${p === k ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
      <span class="right">${isAdmin() ? '<span class="field" style="min-width:150px">Spring 2027 — Draft ▾</span>' : ''}
        <button class="btn sm ghost">Log out</button></span>
    </div>
    ${draftStrip('a')}
    ${state.editing ? editToolbar() : ''}
    <div class="frame-scroll"><div class="page">${body}</div></div>
  </div>`;
}
function editToolbar() {
  return `<div class="edit-toolbar">
    <span class="grow">Editing — 3 unsaved changes</span>
    <button class="btn sm">Preview</button>
    <button class="btn sm" onclick="toggleEdit()">Discard</button>
    <button class="btn sm primary" onclick="toggleEdit()">Save</button>
  </div>`;
}

/* --- Variant B: admin section ------------------------------ */
const ADMIN_NAV = [
  ['Semester', [['semesters', 'Semesters & setup']]],
  ['Content',  [['members', 'Roster'], ['songs', 'Setlist'], ['schedule', 'Rehearsals & assignments']]],
  ['Review',   [['conflicts', 'Conflicts']]],
];
function shellB(body) {
  const p = effectivePage();

  if (!isAdmin()) {
    /* Member: read-only everywhere, no admin door at all. */
    return isPhone()
      ? `<div class="framewrap"><div class="phonebar"><span class="title">${esc(pageTitle())}</span></div>
         <div class="frame-scroll"><div class="page">${body}</div></div>${tabbar(MEMBER_TABS, 'b')}</div>`
      : `<div class="framewrap">${topbarB(p, false)}
         <div class="frame-scroll"><div class="page">${body}</div></div></div>`;
  }

  const sidebarInner = `
    <div class="semester-pick">
      <span class="gb-label">Editing</span>
      <span class="field">Spring 2027 — Draft ▾</span>
      <span class="muted" style="font-size:11.5px">Members see Fall 2026</span>
    </div>
    ${ADMIN_NAV.map(([g, items]) => `
      <div class="group"><span class="gb-label">${g}</span></div>
      ${items.map(([k, l]) => `<a href="#b/${k}" onclick="go('${k}');return false"
        ${p === k ? 'aria-current="page"' : ''}>${l}</a>`).join('')}`).join('')}
    <div class="group" style="margin-top:10px;border-top:1px solid var(--line);padding-top:12px">
      <a href="#b/overview" onclick="go('overview');return false" style="padding-left:0">← Back to member view</a>
    </div>`;

  if (isPhone()) {
    return `<div class="framewrap">
      <div class="adminbar">
        <button class="btn sm" onclick="toggleDrawer()">☰</button>
        <span class="title">${esc(pageTitle())}</span>
        <span class="admin-tag">Admin</span>
      </div>
      <div class="frame-scroll"><div class="page">${body}</div></div>
      ${state.drawer ? `<div class="drawer-backdrop" onclick="toggleDrawer()">
        <div class="drawer" onclick="event.stopPropagation()">${sidebarInner}</div></div>` : ''}
    </div>`;
  }
  return `<div class="framewrap">
    ${topbarB(p, true)}
    <div class="adminshell">
      <aside class="sidebar">${sidebarInner}</aside>
      <div class="frame-scroll" style="flex:1"><div class="page">${body}</div></div>
    </div>
  </div>`;
}
function topbarB(p, admin) {
  return `<div class="topbar">
    <span class="brand">Rolling Sloans</span>
    ${admin ? '<span class="admin-tag">Admin</span>' : `<nav class="topnav">${MEMBER_TABS.map(([k, l]) =>
      `<a href="#b/${k}" onclick="go('${k}');return false" ${p === k ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>`}
    ${admin ? '<span style="flex:1"></span>' : ''}
    <span class="right">
      ${isAdmin() && !admin ? '<button class="btn sm">Admin →</button>' : ''}
      <button class="btn sm ghost">Log out</button></span>
  </div>`;
}

/* --- Variant C: mode switch -------------------------------- */
const ADMIN_EXTRA_TABS = [['conflicts', 'Conflicts'], ['semesters', 'Semesters']];
function shellC(body) {
  const p = effectivePage();
  const tabs = isAdmin()
    ? [...MEMBER_TABS.slice(0, 4), ['more', 'More']]
    : MEMBER_TABS;

  const modeBar = isAdmin() ? `
    <div class="mode-context draft">
      <span><b>Admin mode</b> — editing <b>Spring 2027</b> (draft). Members see Fall 2026.</span>
      <span class="grow"></span>
      <button class="btn sm">Switch semester</button>
    </div>` : '';

  if (isPhone()) {
    return `<div class="framewrap">
      <div class="phonebar">
        <span class="title">${esc(pageTitle())}</span>
        <span class="modeswitch">
          <button aria-pressed="${!isAdmin()}" onclick="setMode('member')">Member</button>
          <button aria-pressed="${isAdmin()}" onclick="setMode('admin')">Admin</button>
        </span>
      </div>
      ${modeBar}
      <div class="frame-scroll"><div class="page">${body}</div></div>
      ${tabbarC(tabs)}
      ${state.sheet ? `<div class="drawer-backdrop" style="align-items:flex-end" onclick="toggleSheet()">
        <div class="sheet" onclick="event.stopPropagation()">
          <span class="gb-label">Admin</span>
          ${ADMIN_EXTRA_TABS.map(([k, l]) =>
            `<a href="#c/${k}" onclick="go('${k}');return false">${l}</a>`).join('')}
          <a href="#c/profile" onclick="go('profile');return false">Your profile</a>
          <a href="#c/overview">Log out</a>
        </div></div>` : ''}
    </div>`;
  }
  return `<div class="framewrap">
    <div class="topbar">
      <span class="brand">Rolling Sloans</span>
      <nav class="topnav">
        ${MEMBER_TABS.map(([k, l]) => `<a href="#c/${k}" onclick="go('${k}');return false"
          ${p === k ? 'aria-current="page"' : ''}>${l}</a>`).join('')}
        ${isAdmin() ? ADMIN_EXTRA_TABS.map(([k, l]) => `<a href="#c/${k}" onclick="go('${k}');return false"
          ${p === k ? 'aria-current="page"' : ''} style="color:var(--ink-2)">${l}</a>`).join('') : ''}
      </nav>
      <span class="right">
        <span class="modeswitch">
          <button aria-pressed="${!isAdmin()}" onclick="setMode('member')">Member</button>
          <button aria-pressed="${isAdmin()}" onclick="setMode('admin')">Admin</button>
        </span>
        <button class="btn sm ghost">Log out</button></span>
    </div>
    ${modeBar}
    <div class="frame-scroll"><div class="page">${body}</div></div>
  </div>`;
}
function tabbarC(tabs) {
  const p = effectivePage();
  return `<nav class="tabbar">${tabs.map(([k, l]) => k === 'more'
    ? `<a href="#" onclick="toggleSheet();return false"><span class="glyph"></span>${l}</a>`
    : `<a href="#c/${k}" onclick="go('${k}');return false" ${p === k ? 'aria-current="page"' : ''}>
        <span class="glyph"></span>${l}</a>`).join('')}</nav>`;
}
function tabbar(tabs, v) {
  const p = effectivePage();
  return `<nav class="tabbar">${tabs.map(([k, l]) =>
    `<a href="#${v}/${k}" onclick="go('${k}');return false" ${p === k ? 'aria-current="page"' : ''}>
      <span class="glyph"></span>${l}</a>`).join('')}</nav>`;
}

const SHELLS = { a: shellA, b: shellB, c: shellC };

/* ============================================================
   Render
   ============================================================ */
function render() {
  const v = state.variant;
  const body = BODIES[effectivePage()](v);
  document.getElementById('stage').innerHTML =
    `<div class="frame ${state.viewport}">${SHELLS[v](body)}</div>`;

  const meta = VARIANTS[v];
  document.getElementById('vname').textContent = `${v.toUpperCase()} · ${meta.name}`;
  document.getElementById('verdict').innerHTML = `
    <h2>Variant ${v.toUpperCase()} — ${esc(meta.name)}</h2>
    <p style="margin:0 0 10px;font-size:13px;color:var(--ink-2)">${esc(meta.blurb)}</p>
    <ul>${meta.verdict.map(([b, t]) => `<li><b>${b}</b> — ${t}</li>`).join('')}</ul>`;
  document.getElementById('pagesel').value = state.page;
  syncSegs();
}
function syncSegs() {
  document.querySelectorAll('#viewportseg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.vp === state.viewport)));
  document.querySelectorAll('#roleseg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.role === state.role)));
}

/* switcher wiring */
document.getElementById('pagesel').innerHTML =
  PAGES.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
document.getElementById('pagesel').onchange = e => go(e.target.value);
document.getElementById('prev').onclick = () =>
  setVariant(ORDER[(ORDER.indexOf(state.variant) + ORDER.length - 1) % ORDER.length]);
document.getElementById('next').onclick = () =>
  setVariant(ORDER[(ORDER.indexOf(state.variant) + 1) % ORDER.length]);
document.querySelectorAll('#viewportseg button').forEach(b =>
  b.onclick = () => { state.viewport = b.dataset.vp; render(); });
document.querySelectorAll('#roleseg button').forEach(b =>
  b.onclick = () => { state.role = b.dataset.role; state.editing = false; render(); });

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});
window.addEventListener('hashchange', () => { readHash(); render(); });

readHash();
render();
</script>
