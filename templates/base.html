<!doctype html>
<title>{% block title %}Rolling Sloans{% endblock %}</title>
<nav>
  <a href="{% url 'scheduling:overview' %}"{% if request.resolver_match.view_name == 'scheduling:overview' %} aria-current="page"{% endif %}>Overview</a>
  <a href="{% url 'scheduling:schedule' %}"{% if request.resolver_match.view_name == 'scheduling:schedule' %} aria-current="page"{% endif %}>My Schedule</a>
  <a href="{% url 'scheduling:conflicts' %}"{% if request.resolver_match.view_name == 'scheduling:conflicts' %} aria-current="page"{% endif %}>Conflicts</a>
  <a href="{% url 'scheduling:setlist' %}"{% if request.resolver_match.view_name == 'scheduling:setlist' %} aria-current="page"{% endif %}>Songs</a>
  <a href="{% url 'scheduling:members' %}"{% if request.resolver_match.view_name == 'scheduling:members' %} aria-current="page"{% endif %}>Band Members</a>
  {# Profile is your own /members/<pk>/ page (issue #139); a teammate's page shares the route but is not this tab. #}
  <a href="{% url 'scheduling:member-detail' request.user.pk %}"{% if request.resolver_match.view_name == 'scheduling:member-detail' and request.resolver_match.kwargs.pk == request.user.pk %} aria-current="page"{% endif %}>Profile</a>
  <form method="post" action="{% url 'identity:logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
</nav>
{% block content %}{% endblock %}
